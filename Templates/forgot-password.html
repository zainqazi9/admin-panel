<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="adminZQ authentication page">
  <title>Forgot Password | adminZQ</title>

  <link href="{{ url_for('static' , filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link href="{{ url_for('static' , filename='css/Resgister.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="/index">
        <img class="brand-icon" src="{{ url_for('static', filename='images/FOOD/zq-logo.svg.svg') }}" alt="ZQ Logo" height="70px" width="70px">
        <span><strong>adminZQ</strong><small>Get a reset link for your account.</small></span>
      </a>

      <form class="needs-validation" novalidate>
        <div class="mb-4">
          <p class="eyebrow mb-1">Secure Access</p>
          <h1 class="h3 mb-1">Forgot Password</h1>
          <p class="text-muted mb-0">Get a reset link for your account.</p>
        </div>
        <div class="mb-4">
          <label class="form-label" for="forgotEmail">Email address</label>
          <input class="form-control" id="forgotEmail" type="email" required>
          <div class="invalid-feedback">Enter a valid email.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-envelope-arrow-up" aria-hidden="true"></i> Send Reset Link</button>
      </form>

      <p class="text-muted small mt-3 mb-0">Check your inbox and spam folder after submitting.</p>
      <div class="auth-footer">Remembered it? <a href="/login">Back to login</a></div>
    </section>
  </main>

  <script src="{{ url_for('static' , filename='js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static' , filename='js/main.js') }}"></script>
</body>
</html>
