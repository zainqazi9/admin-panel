<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="adminZQ authentication page">
  <title>Register | adminZQ</title>

  <link href="{{ url_for('static' , filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link href="{{ url_for('static' , filename='css/Resgister.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="/index">
        <img class="brand-icon" src="{{ url_for('static', filename='images/FOOD/zq-logo.svg.svg') }}" alt="ZQ Logo" height="70px" width="70px">
        <span><strong>adminZQ</strong><small>Create your restaurant staff account.</small></span>
      </a>

      <form class="needs-validation" novalidate>
        <div class="mb-4">
          <p class="eyebrow mb-1">Secure Access</p>
          <h1 class="h3 mb-1">Register</h1>
          <p class="text-muted mb-0">Create your restaurant staff account.</p>
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerName">Full name</label>
          <input class="form-control" id="registerName" type="text" required>
          <div class="invalid-feedback">Full name is required.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerEmail">Email address</label>
          <input class="form-control" id="registerEmail" type="email" required>
          <div class="invalid-feedback">Enter a valid email.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerPassword">Password</label>
          <input class="form-control" id="registerPassword" type="password" minlength="6" required>
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="terms" required>
          <label class="form-check-label" for="terms">I agree to the terms</label>
          <div class="invalid-feedback">You must agree before continuing.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-person-plus" aria-hidden="true"></i> Create Account</button>
      </form>

      <div class="auth-footer">Already have an account? <a href="/login">Sign in</a></div>
    </section>
  </main>

  <script src="{{ url_for('static' , filename='js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static' , filename='js/main.js') }}"></script>
</body>
</html>
